<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
        <h2>Pagina de contacto</h2>
    </header>
    <nav>
      <a href="index.html">Inicio</a>
    </nav>
    <main>
      <h2>
        Rellena el siguiente formulario y nos pondremos en contacto contigo lo
        antes posible
      </h2>
      <form action="#" method="post"></form>
      <div>
        <label for="text">Nombre:</label>
        <input
          type="text"
          name="text"
          id="text"
          placeholder="Escribe aqui tu nombre"
        />
      </div>
      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="ejemplo@gmail.com"
          required
        />
      </div>
      <div>
        <label for="number">Telefono:</label>
        <input type="number" name="number" id="number" />
      </div>
      <div>
        <label for="mensaje">Deja aqui tu mensaje:</label>
        <textarea name="mensaje" id="mensaje"></textarea>
      </div>
      <div>
        <label for="checkbox">Acepte para recibir publicidad</label>
        <input type="checkbox" name="checkbox" id="checkbox" />
      </div>

      <input type="submit" value="Enviar" />

      
     <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d10893885.202367919!2d-66.30569679899348!3d-2.828585067049927!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x926eca1645365b6b%3A0xabfc431d20b2b474!2sAmazonas!5e0!3m2!1ses!2ses!4v1768421796096!5m2!1ses!2ses" width="300" height="250" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
     <address>Calle Insectum n421, Cuenca del Amazonas.Brasil</address>
    </main>
    <footer>
      <small>&copy;2024. Todos los derechos reservados</small>
    </footer>
  </body>
</html>
